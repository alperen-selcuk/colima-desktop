name: Release

# Builds and publishes a draft GitHub Release with platform bundles whenever a
# `v*` tag is pushed, or on demand via workflow_dispatch.
#
# macOS: a single universal (arm64 + x86_64) .dmg/.app.
# Linux: .deb + .rpm + .AppImage for both x86_64 and aarch64.
#
# NOTE: macOS builds are unsigned/unnotarized unless the APPLE_CERTIFICATE
# secret (and friends) are configured on this repository. Unsigned users who
# download the .app/.dmg may see a Gatekeeper warning and need to clear the
# quarantine attribute themselves:
#
#   xattr -dr com.apple.quarantine "/Applications/Colima Desktop.app"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.settings.name }})
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: macos-universal
            os: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: linux-x86_64
            os: ubuntu-22.04
            rustTargets: ""
            args: ""
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            rustTargets: ""
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri Linux dependencies
        if: startsWith(matrix.settings.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev \
            libxdo-dev \
            patchelf \
            file \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Import Apple signing certificate
        if: matrix.settings.os == 'macos-latest' && secrets.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Colima Desktop ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release notes."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.settings.args }}
