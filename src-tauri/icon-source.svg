<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13201a"/>
      <stop offset="100%" stop-color="#0b120e"/>
    </linearGradient>
  </defs>

  <!-- macOS-style rounded-square tile, corner radius ~22.5% -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- mark: laptop with a shipping container on the screen, centered with ~100px margin -->
  <g transform="translate(512 512)">
    <g transform="translate(-384 -384) scale(24)">
      <!-- laptop screen outline -->
      <rect x="4" y="4.5" width="24" height="16.5" rx="2.4" stroke="#3ecf8e" stroke-width="1.9" fill="none"/>
      <!-- laptop base -->
      <path d="M2.4 24.2h27.2c.5 0 .8.55.55 1L28.6 27.4a1.6 1.6 0 0 1-1.4.8H4.8a1.6 1.6 0 0 1-1.4-.8L1.85 25.2c-.25-.45.05-1 .55-1Z" fill="#3ecf8e"/>
      <!-- container inside the screen -->
      <rect x="8.4" y="8.4" width="15.2" height="8.7" rx="1.4" fill="#3ecf8e"/>
      <rect x="9.9" y="9.5" width="1.35" height="6.5" fill="#1f9d68"/>
      <rect x="12.75" y="9.5" width="1.35" height="6.5" fill="#1f9d68"/>
      <rect x="15.6" y="9.5" width="1.35" height="6.5" fill="#1f9d68"/>
      <rect x="18.45" y="9.5" width="1.35" height="6.5" fill="#1f9d68"/>
      <rect x="21.3" y="9.5" width="1.35" height="6.5" fill="#1f9d68"/>
    </g>
  </g>
</svg>
